name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: npm test
      - run: node server.mjs --release --build-only
      - run: python3 scripts/document-api.py --check
      - run: npm install --no-save --package-lock=false typescript@5.8.3 marked@12.0.2 katex@0.16.11
      - run: npm run test:ui
      - run: cargo build --locked -p study-hub
