name: Docker
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Compose and health checks
        run: npm run test:docker-config
      - name: Build image
        run: docker build -t studyhub:smoke .
      - name: Test authentication and persistence
        run: node tests/docker-smoke.mjs studyhub:smoke
