function Upload({ver,refresh,sessions}){
 const bulkStop=React.useRef(false);
 const [bulk,setBulk]=useState(false),[queue,setQueue]=useState(null),[bulkResults,setBulkResults]=useState([]);

 const bulkGo=async()=>{
  const pending=[...files];bulkStop.current=false;setBusy(true);setRes(null);setBulkResults([]);
  try{
   for(let i=0;i<pending.length;i++){
    if(bulkStop.current)break;
    const file=pending[i];setQueue({index:i+1,total:pending.length,name:file.name});
    try{
     const body=new FormData();body.append('file',file);body.append('unknown','true');if(f.course_name.trim())body.append('course_name',f.course_name.trim());if(f.class_type.trim())body.append('class_type',f.class_type.trim());if(skipHuman)body.append('skip_human','true');if(noteStyle)body.append('note_style',noteStyle);
     const {session_id}=await api('/api/submit',{method:'POST',body});
     setActive({id:session_id,append:false});
     let row;
     do{
      await new Promise(resolve=>setTimeout(resolve,2000));
      row=await api('/api/review/session/'+session_id);await refresh();
     }while(['running','waiting','review'].includes(row.status));
     setBulkResults(p=>[...p,{name:file.name,ok:row.status==='done',message:row.error||row.title}]);
    }catch(e){setRes({ok:false,msg:e.message});break}
    setFiles(p=>p.filter(x=>x!==file));
   }
  }finally{setQueue(null);setBusy(false);await refresh()}
 };
 const [files,setFiles]=useState([]),[cts,setCts]=useState([]),[busy,setBusy]=useState(false),[res,setRes]=useState(null),
  [prev,setPrev]=useState(null),[append,setAppend]=useState(false),

 const [skipHuman,setSkipHuman]=useState(false);
 const [active,setActive]=useState(null);
 const act=active&&sessions.find(r=>r.id===active.id);
 const running=busy||(act&&(['running','waiting','review'].includes(act.status)));
 const killAct=async()=>{bulkStop.current=true;try{await api(`/api/review/session/${act.id}/kill`,{method:'POST'});await refresh()}catch(e){setRes({ok:false,msg:e.message})}};
 useEffect(()=>{api('/api/lookup').then(j=>setCts(j.class_types))},[ver,act&&act.status]);
 const set=k=>e=>setF({...f,[k]:e.target.value});
 const add=l=>{if(!running)setFiles(p=>[...p,...Array.from(l)])};
 const sortNames=()=>setFiles(p=>[...p].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})));
 const pick=async ct=>{if(!ct)return;const j=await api('/api/lookup?class_type='+encodeURIComponent(ct));
  setF(p=>({...p,class_type:ct,course_link:p.course_link||j.course_link,course_id:p.course_id||j.course_id}))};
 const done=sessions.filter(r=>r.status==='done'&&r.title);
 const label=r=>`${r.class_type} / ${r.course} / ${r.unit?`U${r.unit} `:''}${r.lesson} - ${r.title}`;
 const loadPrev=async r=>{setPrev(r);setAppend(false);if(!r)return;
  const j=await api('/api/lookup?class_type='+encodeURIComponent(r.class_type));
  setF({course_name:r.course,unit:r.unit,lesson:r.lesson,class_type:r.class_type,course_link:j.course_link,course_id:j.course_id})};

 const go=async()=>{setBusy(true);setRes(null);
  try{const d=new FormData();files.forEach(x=>d.append('file',x));Object.entries(f).forEach(([k,v])=>d.append(k,v));
   if(lock)d.append('append_to',prev.id);if(noteStyle)d.append('note_style',noteStyle);
   const r=await api('/api/submit',{method:'POST',body:d});

  catch(e){setRes({ok:false,msg:e.message})}setBusy(false)};
 return <Stack spacing={2}>
  <Box><Typography data-tour="notes-upload" variant="h5" gutterBottom>Add Your Notes</Typography><Typography variant="body2" color="text.secondary">Upload your pages. Review the draft. Save to Obsidian.</Typography></Box>
  <FormControlLabel control={<Switch disabled={running} checked={bulk} onChange={e=>{setBulk(e.target.checked);setAppend(false)}}/>} label="Bulk unknown upload"/>
  {bulk&&<FormControlLabel control={<Switch disabled={running} checked={skipHuman} onChange={e=>setSkipHuman(e.target.checked)}/>} label="Skip human intervention"/>}
  {bulk&&skipHuman&&<Typography variant="body2" color="text.secondary">Save generated notes automatically and skip clarification questions. Unreadable content stays marked illegible. Automatic saves do not create human correction lessons.</Typography>}
  {bulk&&<Notice severity="info">Each file becomes its own note; each PDF keeps all its pages together. Set Class and Course below, or leave either blank for the AI to infer. Lesson and unit name are inferred per file. Unit numbers stay optional. Files are uploaded and processed one at a time (64 MiB per file). Keep this tab open until the queue finishes.</Notice>}
  {queue&&<Notice severity="info">Processing {queue.index} of {queue.total}: {queue.name}</Notice>}
  {bulkResults.length>0&&<Box sx={{maxHeight:240,overflow:'auto'}}>{bulkResults.map((r,i)=><Typography key={i} color={r.ok?'primary':'error'}>{r.name}: {r.message||'Failed'}</Typography>)}</Box>}

  <Paper variant="outlined" sx={{p:{xs:2,sm:3},textAlign:'center',borderStyle:'dashed',borderWidth:2,bgcolor:'rgba(0,0,0,.06)',transition:'border-color .18s,background-color .18s','&:hover':{borderColor:'primary.main',bgcolor:'action.hover'}}} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();add(e.dataTransfer.files)}}>
   <Typography color="text.secondary" gutterBottom>{bulk?'Drop any number of note files here. Each file is processed separately with inferred context.':'Drop all pages of one set of notes here (JPG, PNG, WEBP, PDF, Markdown .md, or HEIC/AVIF/TIFF with auto-convert on). Together they become ONE note, in the order shown.'}</Typography>
   <Button disabled={running} component="label" variant="outlined">Choose files<input hidden multiple type="file" accept="image/*,.pdf,.md,.markdown,.txt,.heic,.heif,.avif,.tif,.tiff,.bmp" onChange={e=>{add(e.target.files);e.target.value=''}}/></Button>
   {files.length>1&&<Button disabled={running} onClick={sortNames} sx={{ml:1}}>Sort by name</Button>}
   <Box sx={{mt:2,maxHeight:170,overflow:'auto'}}>{files.slice(0,100).map((x,i)=><Chip key={i} label={`${i+1}. ${x.name}`} sx={{m:.3}} onDelete={running?undefined:()=>setFiles(p=>p.filter((_,j)=>j!==i))}/>)}</Box>
  </Paper>
  <Typography variant="caption">{files.length} file(s) selected{files.length>100?" (showing first 100)":""}</Typography>
  <Paper variant="outlined" sx={{p:{xs:2,sm:2.5}}}><Stack spacing={2.5}>
   <TextField select label="Note Style for this upload" value={noteStyle} onChange={e=>setNoteStyle(e.target.value)}><MenuItem value="">Use settings default</MenuItem><MenuItem value="bullet_points">Bullet points</MenuItem><MenuItem value="text_chunks">Text chunks</MenuItem><MenuItem value="hybrid">Combined · light text and bullets</MenuItem></TextField>
   <Typography variant="subtitle2">{bulk?'Bulk filing (optional)':'Note details'}</Typography>
   <Stack direction={{xs:"column",sm:"row"}} spacing={2}>
    <TextField required={!bulk} fullWidth disabled={lock||running} label={bulk?"Course (optional)":"Course Name"} helperText={bulk?"Applies to every file. Leave blank to infer each course.":undefined} value={f.course_name} onChange={set('course_name')}/>
    <Autocomplete freeSolo fullWidth disabled={lock||running} options={cts} inputValue={f.class_type} onInputChange={(_,v)=>setF(p=>({...p,class_type:v}))}
     onChange={(_,v)=>pick(v)} renderInput={p=><TextField {...p} required={!bulk} label={bulk?"Class / Subject (optional)":"Class Type (e.g. Physics)"} helperText={bulk?"For example Math or Physics. Leave blank to infer.":undefined} onBlur={()=>pick(f.class_type)}/>}/></Stack>
   {!bulk&&<>
   <Stack direction={{xs:"column",sm:"row"}} spacing={2}>
    <TextField disabled={lock} label="Unit Number (optional)" placeholder="2.1" value={f.unit} onChange={set('unit')} sx={{width:150}}/>
    <TextField required fullWidth disabled={lock} label="Lesson Name" helperText="The AI infers the unit name from your notes." value={f.lesson} onChange={set('lesson')}/></Stack>
   <Stack direction={{xs:"column",sm:"row"}} spacing={2}>
    <TextField fullWidth disabled={lock} label="Course Link (optional)" value={f.course_link} onChange={set('course_link')}/>
    <TextField disabled={lock} label="Course ID (optional)" value={f.course_id} onChange={set('course_id')} sx={{width:180}}/></Stack>
   </>}
   <Button variant="contained" size="large" disabled={!ok||running} onClick={bulk?bulkGo:go}>{running?(act&&act.status==='review'?'Review your draft before saving':act&&act.status==='waiting'?'Waiting for your answer...':'Reading pages and writing your note...'):bulk?`Process ${files.length} unknown file(s)`:lock?`Add ${files.length||''} page(s) to this note`:`Create note from ${files.length||''} page(s)`}</Button>

  </Stack></Paper>

// Renders markdown (Obsidian flavour) and mermaid diagrams. Invalid diagrams fall back to showing their source.
function Md({md,sid=0,nolink=false,onNote,highlightHeading='',highlightAll=false,documentPath=''}){
 const ref=React.useRef(null);
 const html=React.useMemo(()=>render(md||'',sid,nolink),[md,sid,nolink]);
 useEffect(()=>{
  const el=ref.current;if(!el)return;let cancelled=false;
  el.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h=>{h.id=h.textContent});
  let selected=false,rank=0,target=null;
  Array.from(el.children).forEach(child=>{
   child.classList.remove('source-highlight');
   if(/^H[1-6]$/.test(child.tagName)){
    const matches=highlightHeading&&child.textContent.trim().replace(/\s+#+$/, '').toLowerCase()===highlightHeading.trim().toLowerCase();
    if(matches){selected=true;rank=Number(child.tagName[1]);target=child}else if(selected&&Number(child.tagName[1])<=rank)selected=false;
   }
   if(selected||highlightAll)child.classList.add('source-highlight');
  });
  if(target&&typeof target.scrollIntoView==='function')target.scrollIntoView({block:'center',behavior:'smooth'});

  el.querySelectorAll('pre > code').forEach(code=>{
   if(!code.className.toLowerCase().split(/\s+/).includes('language-mermaid'))return;
   const source=code.textContent.trim(),node=document.createElement('div');node.className='mermaid';node.textContent='Rendering diagram…';
   code.parentElement.replaceWith(node);const id=`note-diagram-${++diagramId}`;
   // Mermaid uses shared rendering state; serialize across all mounted viewers.
   diagramQueue=diagramQueue.catch(()=>{}).then(async()=>{
    if(cancelled)return;
    try{
     const {svg,bindFunctions}=await mermaid.render(id,source);
     if(cancelled||!node.isConnected)return;
     node.innerHTML=DOMPurify.sanitize(svg,{USE_PROFILES:{html:true,svg:true,svgFilters:true},ADD_TAGS:['foreignObject']});
     bindFunctions?.(node);
    }catch(error){
     document.getElementById('d'+id)?.remove();
     if(cancelled||!node.isConnected)return;
     node.className='diagram-error';node.textContent='';
     const message=document.createElement('div');message.textContent='Diagram could not render. Edit its Mermaid source below.';
     const details=document.createElement('details'),label=document.createElement('summary'),pre=document.createElement('pre');
     label.textContent='Mermaid source and error';pre.textContent=source+'\n\n'+String(error.message||error);details.append(label,pre);node.append(message,details);
    }
   });
  });
  return()=>{cancelled=true};
 },[html,highlightHeading,highlightAll]);
 const click=e=>{
  const a=e.target.closest('a');if(!a)return;
  if(a.dataset.note){e.preventDefault();if(a.dataset.note.includes('/')||!onNote)window.dispatchEvent(new CustomEvent('vault-open',{detail:{path:a.dataset.note,heading:a.dataset.heading}}));else onNote(a.dataset.note,a.dataset.heading);return}
  const href=a.getAttribute('href')||'';
  if(!/^[a-z][a-z0-9+.-]*:/i.test(href)&&!href.startsWith('/')&&/\.md(?:#.*)?$/i.test(href)){
   e.preventDefault();const target=new URL(href,'https://vault.invalid/'+documentPath);window.dispatchEvent(new CustomEvent('vault-open',{detail:{path:decodeURIComponent(target.pathname.slice(1)),heading:decodeURIComponent(target.hash.slice(1))}}));return;
  }
  const heading=a.dataset.heading||(a.getAttribute('href')?.startsWith('#')?decodeURIComponent(a.getAttribute('href').slice(1)):'');
  if(heading){const target=Array.from(ref.current.querySelectorAll('[id]')).find(h=>h.id===heading||h.id.toLowerCase().replace(/\s+/g,'-')===heading);if(target){e.preventDefault();target.scrollIntoView({block:'start',behavior:'smooth'})}}
 };
 return <Box ref={ref} onClick={click} sx={mdSx} dangerouslySetInnerHTML={{__html:html}}/>;
}

// AI outputs are JSON; show them as readable markdown (with a Raw toggle)
const RICH=['output','thinking','guidance'];
const aiMd=v=>{if(typeof v!=='string')return '```json\n'+JSON.stringify(v,null,1)+'\n```';
 try{const o=JSON.parse(v);if(o&&typeof o==='object'){
  if(o.body!==undefined)return `**${o.title||''}**\n\n*${o.summary||''}*\n\n${o.body}\n\n`+((o.links||[]).map(l=>`- [[${l.target}]] - ${l.how}`).join('\n'));
  if(o.big_ideas)return o.big_ideas.map(i=>`- **${i.name}** connects to *${i.connects_to}*: ${i.how}\n  - evidence: ${i.evidence}`).join('\n')+((o.questions||[]).length?'\n\n**Questions:**\n'+o.questions.map(q=>'- '+q).join('\n'):'');
  if('approved' in o)return `**${o.approved?'Approved':'Rejected'}**\n\n`+[...(o.issues||[]),...(o.questions||[])].map(i=>'- '+i).join('\n');
  if('answer' in o)return o.answer;if('question' in o)return o.question;
  if('resolved' in o)return `**${o.resolved?'Resolved':'Not resolved'}**\n\n${o.instructions||''}`;
  return '```json\n'+JSON.stringify(o,null,1)+'\n```'}}catch(e){}
 return v};
function Field({k,v}){

   :<Box component="pre" sx={pre}>{typeof v==='string'?v:JSON.stringify(v,null,1)}</Box>}</Box>;
}

function VaultBrowser(){
 const [doc,setDoc]=useState(null),[error,setError]=useState(''),[history,setHistory]=useState([]),[loading,setLoading]=useState(false);
 const request=React.useRef(0);
 const open=async(path,heading='',back=false)=>{const token=++request.current;setLoading(true);setError('');try{const next=await api('/api/vault/document?path='+encodeURIComponent(path));if(token!==request.current)return;if(!back&&doc)setHistory(old=>[...old,doc]);setDoc({...next,heading})}catch(e){if(token===request.current)setError(e.message)}finally{if(token===request.current)setLoading(false)}};
 useEffect(()=>{const follow=e=>open(e.detail.path,e.detail.heading);window.addEventListener('vault-open',follow);return()=>window.removeEventListener('vault-open',follow)},[doc]);
 const close=()=>{request.current++;setDoc(null);setError('');setHistory([]);setLoading(false)};
 return <Dialog open={!!doc||loading||!!error} onClose={close} fullWidth maxWidth="lg"><DialogTitle>{doc?.title||'Big Ideas'}</DialogTitle><DialogContent dividers>{loading&&<LinearProgress/>}{error&&<Notice severity="error">{error}</Notice>}{doc&&<Md md={doc.body} documentPath={doc.path} highlightHeading={doc.heading} onNote={(path,heading)=>open(path,heading)}/>}</DialogContent><DialogActions>{history.length>0&&<Button onClick={()=>{const previous=history[history.length-1];request.current++;setHistory(old=>old.slice(0,-1));setDoc(previous);setLoading(false);setError('')}}>Back</Button>}<Button onClick={close}>Close</Button></DialogActions></Dialog>;
}

   {d.pdfs.map((p,i)=><Button key={p} size="small" variant="outlined" target="_blank" href={appUrl(`/api/review/session/${d.id}/pdf/${encodeURIComponent(p)}`)}>{p.endsWith('.pdf')?'PDF':'MD'} {i+1}</Button>)}

function Changes({text}){
 if(!text)return <Typography color="text.secondary">No changes to the AI draft.</Typography>;
 return <Box component="pre" sx={{...pre,maxHeight:'none'}}>{text.split('\n').map((line,i)=><Box component="span" key={i} sx={{display:'block',color:line.startsWith('+')?'success.light':line.startsWith('-')?'error.light':'text.primary'}}>{line||' '}</Box>)}</Box>;
}
const reviewSnapshot=e=>`# ${e.title}\nSummary: ${e.summary}\nUnit name: ${e.unit_name}\n\n${e.body}`;
const lineChanges=(before,after)=>{
 if(before===after)return '';
 const a=before.split('\n'),b=after.split('\n');let start=0,ae=a.length,be=b.length;
 while(start<Math.min(ae,be)&&a[start]===b[start])start++;
 while(ae>start&&be>start&&a[ae-1]===b[be-1]){ae--;be--}
 const x=a.slice(start,ae),y=b.slice(start,be),width=y.length+1;
 const lines=['--- AI draft','+++ Human revision',`@@ starting at line ${start+1} @@`];
 if((x.length+1)*width>1000000)return [...lines,...x.map(l=>'-'+l),...y.map(l=>'+'+l)].join('\n');
 const dp=new Uint32Array((x.length+1)*width);
 for(let i=x.length-1;i>=0;i--)for(let j=y.length-1;j>=0;j--)dp[i*width+j]=x[i]===y[j]?1+dp[(i+1)*width+j+1]:Math.max(dp[(i+1)*width+j],dp[i*width+j+1]);
 let i=0,j=0;
 while(i<x.length||j<y.length){
  if(i<x.length&&j<y.length&&x[i]===y[j]){lines.push(' '+x[i]);i++;j++}
  else if(i<x.length&&(j===y.length||dp[(i+1)*width+j]>=dp[i*width+j+1]))lines.push('-'+x[i++]);
  else lines.push('+'+y[j++]);

};

 {!source?<Notice severity="info">No original upload is available for this older note. Its saved transcription is still available.</Notice>:source.type==='application/pdf'?<Box component="iframe" title={'Actual upload: '+source.name} src={appUrl(source.url)} sx={{width:'100%',height:'100%',minHeight:450,border:0}}/>:source.type.startsWith('image/')?<Box component="img" alt={source.name} src={appUrl(source.url)} onError={()=>setErr('The browser could not display this image')} sx={{maxWidth:'100%',height:'auto'}}/>:source.type.startsWith('text/')?<><Button size="small" onClick={()=>setRaw(!raw)}>{raw?'Show Markdown Preview':'Show Original Text'}</Button>{raw?<Box component="pre" sx={{...pre,maxHeight:'none'}}>{text||'Loading source…'}</Box>:<Md md={text} nolink/>}</>:<Button href={appUrl(source.url)} target="_blank" rel="noopener noreferrer">Open Uploaded File</Button>}
 </Box></>}
 </Stack>;
}
function NoteStyleControl({id}){
 const [value,setValue]=useState(''),[error,setError]=useState(''),[ready,setReady]=useState(false);
 useEffect(()=>{setReady(false);api(`/api/review/session/${id}/style`).then(v=>{setValue(v.note_style);setReady(true)}).catch(e=>setError(e.message))},[id]);
 const choose=async e=>{const style=e.target.value;setError('');try{await api(`/api/review/session/${id}/style`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({note_style:style})});setValue(style)}catch(e){setError(e.message)}};
 return <Box sx={{my:1}}><TextField fullWidth select label="Note Style for This Note" disabled={!ready} value={value} onChange={choose} helperText={error||'Saved for this note. Applied when you regenerate it or add more pages.'} error={!!error}><MenuItem value="">Settings Default</MenuItem><MenuItem value="bullet_points">Bullet Points</MenuItem><MenuItem value="text_chunks">Text Chunks</MenuItem><MenuItem value="hybrid">Combined · Light Text and Bullets</MenuItem></TextField></Box>;
}

function HumanReview({id,refresh}){
 const [q,setQ]=useState(null),[edit,setEdit]=useState(null),[tab,setTab]=useState(0),[busy,setBusy]=useState(false),[err,setErr]=useState(''),[saved,setSaved]=useState('');
 const load=()=>api(`/api/review/session/${id}/human`).then(j=>{setQ(j);setEdit(j.edits);setErr('')}).catch(e=>setErr(e.message));
 useEffect(()=>{setQ(null);setEdit(null);load()},[id]);
 useEffect(()=>{
  if(!edit||busy)return;setSaved('Saving review…');const controller=new AbortController();
  const timer=setTimeout(()=>api(`/api/review/session/${id}/human`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(edit),signal:controller.signal})
   .then(()=>setSaved('Review saved')).catch(e=>{if(e.name!=='AbortError')setSaved('Review could not autosave: '+e.message)}),600);
  return()=>{clearTimeout(timer);controller.abort()};
 },[edit,id,busy]);
 const set=k=>e=>setEdit(p=>({...p,[k]:e.target.value}));
 const finish=async action=>{
  setBusy(true);setErr('');
  try{await api(`/api/review/session/${id}/human`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...edit,action})});if(action==='approve'&&EMBEDDED)window.parent.postMessage({type:'notes-tour-reviewed'},location.origin);await refresh()}
  catch(e){setErr(e.message)}finally{setBusy(false)}
 };
 const diff=q&&edit?lineChanges(reviewSnapshot(q.draft),reviewSnapshot(edit)):'';
 return <Dialog open maxWidth={false} scroll="paper" PaperProps={{sx:{width:'98vw',height:'96vh',maxWidth:'none'}}}>
  <DialogTitle>Review your notes before saving{q?` — ${q.class_type} / ${q.course}`:''}</DialogTitle>
  <DialogContent dividers sx={{display:'flex',flexDirection:'column',minHeight:0,gap:1,p:2}}>
   {err&&<Notice severity="error">{err}{!q&&<Button onClick={load}>Reload review</Button>}</Notice>}
   {!q||!edit?<LinearProgress/>:<>
    <Typography variant="body2" color="text.secondary">Compare the source with the draft. Edit the Markdown directly, check the preview, and save when ready. Your edits and feedback are saved as lessons for future notes.</Typography>
    <Box sx={{display:'grid',gridTemplateColumns:{xs:'1fr',md:'minmax(0,1fr) minmax(0,1fr)'},gap:2,flex:1,minHeight:0,overflow:'auto'}}>
     <Paper variant="outlined" sx={{p:2,minWidth:0,minHeight:400,height:'100%',boxSizing:'border-box'}}><SourcePreview sources={q.sources} transcript={q.transcript}/></Paper>
     <Stack spacing={1.5} sx={{minWidth:0,minHeight:400,height:'100%',p:2,border:'1px solid',borderColor:'divider',borderRadius:'12px',boxSizing:'border-box'}}>
      <Stack direction="row" spacing={1}>
       <TextField size="small" fullWidth label="Note title" disabled={busy||q.locked_title} value={edit.title} onChange={set('title')}/>
       <TextField size="small" fullWidth label="Unit name" disabled={busy} value={edit.unit_name} onChange={set('unit_name')}/>
      </Stack>
      <Typography variant="subtitle1">AI Notes</Typography><TextField size="small" fullWidth label="Summary" disabled={busy} value={edit.summary} onChange={set('summary')}/>
      <Tabs value={tab} onChange={(_,v)=>setTab(v)} variant="scrollable" scrollButtons="auto"><Tab label="Edit notes"/><Tab label="Preview"/><Tab label="Your changes"/></Tabs>
      <Box sx={{flex:1,minHeight:200,overflow:'auto'}}>
       {tab===0?<Box component="textarea" aria-label="Edit AI notes in Markdown" disabled={busy} value={edit.body} onChange={set('body')} spellCheck={false}
        sx={{width:'100%',height:'100%',minHeight:200,boxSizing:'border-box',resize:'none',font:'14px/1.6 ui-monospace,monospace',bgcolor:'background.default',color:'text.primary',border:'1px solid',borderColor:'divider',borderRadius:'8px',p:1.5}}/>
        :tab===1?<Md md={edit.body} sid={id}/>:<Changes text={diff}/>}
      </Box>
      <TextField InputLabelProps={{shrink:true}} InputProps={{inputComponent:RichMarkdownControl}} multiline minRows={2} label="What should the AI learn from your edits? (optional)" disabled={busy} value={edit.feedback} onChange={set('feedback')}/>
      <Typography variant="caption" color="text.secondary">{saved}</Typography>
     </Stack>
    </Box>
   </>}
  </DialogContent>
  <DialogActions>
   <Button color="error" disabled={busy||!edit} onClick={()=>finish('discard')}>Discard draft</Button>
   <Button variant="contained" disabled={busy||!edit||!edit.body.trim()||!edit.title.trim()} onClick={()=>finish('approve')}>{busy?'Saving…':'Save reviewed note'}</Button>
  </DialogActions>
 </Dialog>;
}

function Ask({id,refresh}){
 const [q,setQ]=useState(null),[a,setA]=useState(''),[busy,setBusy]=useState(false);
 useEffect(()=>{let on=true;const f=()=>api(`/api/review/session/${id}/question`).then(j=>{if(on)setQ(j.question?j:null)}).catch(()=>{});
  f();const t=setInterval(f,1500);return()=>{on=false;clearInterval(t)}},[id]);
 const [submitted,setSubmitted]=useState('');
 const send=async(action,txt)=>{if(busy)return;setSubmitted(txt);setBusy(true);
  try{await api(`/api/review/session/${id}/answer`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answer:txt,action})});setA('');setQ(null);refresh()}catch(e){}
  setBusy(false)};
 const acts=(q&&q.actions&&q.actions.length)?q.actions:[{id:'send',label:'Send answer'},{id:'skip',label:'Skip (no answer)'}];
 const secs=(q&&q.sections)||[];
 const big=secs.find(s=>s.scroll||s.collapsed);
 const rest=secs.filter(s=>s!==big);
 return <Dialog open={!!q} maxWidth={false} scroll="paper" PaperProps={{sx:{width:'96vw',height:'92vh',maxWidth:'none'}}}>
  <DialogTitle>{q&&q.page>0?`The AI needs help reading page ${q.page} of ${q.total}`:'The AI needs your input'}</DialogTitle>
  <DialogContent dividers sx={{p:0,display:'flex',overflow:'hidden'}}>
   <Box sx={{display:'flex',flex:1,minHeight:0,minWidth:0}}>
    <Box sx={{width:big?'38%':'100%',flexShrink:0,overflow:'auto',p:2,borderRight:big?1:0,borderColor:'divider'}}>
     {q&&(secs.length?<Notice severity="warning" sx={{mb:2}}>{q.question}</Notice>:<Typography gutterBottom sx={{whiteSpace:'pre-wrap'}}>{q.question}</Typography>)}
     {rest.map((s,i)=><Paper key={i} variant="outlined" sx={{p:1.5,mb:1.5,borderLeft:'4px solid',borderLeftColor:i===1?'secondary.main':'primary.main'}}>
       <Typography variant="overline" color="secondary" display="block">{s.label}</Typography><Md md={s.text} nolink/></Paper>)}
     {q&&q.page>0&&<Box component="img" src={appUrl(`/api/review/session/${id}/page?p=${q.page}&q=${encodeURIComponent(q.question)}`)} sx={{maxWidth:'100%',maxHeight:'60vh',borderRadius:1,display:'block',mb:2}}/>}
     {submitted&&<Paper variant="outlined" sx={{px:1.5,py:.5,mb:1,borderRadius:'8px'}}><Typography variant="caption">You</Typography><Typography sx={{whiteSpace:'pre-wrap'}}>{submitted}</Typography></Paper>}{busy&&<LinearProgress sx={{mb:1}}/>}
     <TextField disabled={busy} autoFocus fullWidth multiline minRows={3} label={secs.length?'Why is this the right call, how does it work, or what is wrong with it? (optional)':'Your answer'} helperText="Enter to Send · Shift+Enter for a New Line" value={a} onChange={e=>setA(e.target.value)}
      onKeyDown={e=>submitOnEnter(e,()=>{const p=acts.find(x=>x.id==='send')||acts.find(x=>x.id==='accept')||acts[0];if(p.id!=='send'||a.trim())send(p.id,p.id==='skip'?'':a)},!busy)}/>
    </Box>
    {big&&<Box sx={{flex:1,minWidth:0,overflow:'auto',p:2}}>
     <Typography variant="overline" color="secondary" display="block">{big.label}</Typography><Md md={big.text} nolink/></Box>}
   </Box></DialogContent>
  <DialogActions>{acts.map(x=><Button key={x.id} disabled={busy||(x.id==='send'&&!a.trim())} variant={x.id==='send'||x.id==='accept'?'contained':'text'} color={x.id==='discard'?'error':x.id==='accept'?'secondary':'primary'}
    onClick={()=>send(x.id,x.id==='skip'?'':a)}>{x.label}</Button>)}</DialogActions></Dialog>;
}

function App(){
 const [s,setS]=useState(null),[open,setOpen]=useState(false),[sessions,setSessions]=useState([]),[ver,setVer]=useState(0),[status,setStatus]=useState({}),[side,setSide]=useState(true),[uploadOpen,setUploadOpen]=useState(true);

   <Paper variant="outlined" sx={{overflow:{xs:'visible',lg:'auto'},minWidth:0,p:uploadOpen?{xs:2,md:3}:.5,borderRadius:'12px',display:uploadOpen?'block':'flex',alignItems:'center',justifyContent:'center'}}><Button size="small" onClick={()=>setUploadOpen(!uploadOpen)} aria-expanded={uploadOpen} aria-label={uploadOpen?'Collapse Add Your Notes':'Expand Add Your Notes'} sx={{minWidth:0,mb:uploadOpen?1:0,...(!uploadOpen&&{width:36,height:36,p:0,fontSize:24,lineHeight:1,display:'flex',alignItems:'center',justifyContent:'center'})}}>{uploadOpen?'‹ Collapse Add Your Notes':'›'}</Button><Box sx={{display:uploadOpen?'block':'none'}}><Upload ver={ver} refresh={refresh} sessions={sessions}/></Box></Paper>

  </Box></ThemeProvider>;
