function sourceSections(source){
 if(!source?.body)return[];const parts=[];let current={heading:'',body:[],ordinal:0},ordinal=0,fence=null;
 for(const line of source.body.replace(/\r\n/g,'\n').split('\n')){
  const marker=/^ {0,3}(`{3,}|~{3,})/.exec(line);
  if(marker){if(!fence)fence=marker[1];else if(marker[1][0]===fence[0]&&marker[1].length>=fence.length&&line.slice(marker[0].length).trim()==='')fence=null;}
  const h=!fence&&/^ {0,3}#{1,6}[ \t]+(.+?)(?:[ \t]+#+)?[ \t]*$/.exec(line);
  if(h){if(current.body.some(l=>l.trim()))parts.push({...current,body:current.body.join('\n')});current={heading:h[1],body:[line],ordinal:++ordinal}}else current.body.push(line);
 }
 if(current.body.some(l=>l.trim()))parts.push({...current,body:current.body.join('\n')});if(!ordinal){const excerpts=source.body.split('\n\n').filter(p=>p.trim()).flatMap(p=>{const chars=Array.from(p),out=[];for(let i=0;i<chars.length;i+=1200)out.push(chars.slice(i,i+1200).join(''));return out});return excerpts.map((body,i)=>({heading:'Source Excerpt '+(i+1),ordinal:i+1,body}))}return parts;
}
